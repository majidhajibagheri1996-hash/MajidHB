<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="backdrop"></div>
  <div id="bg-a" class="bg"></div>
  <div id="bg-b" class="bg"></div>
  <div id="dim"></div>

  <header>
    <div id="hero">
      <div id="greeting"></div>
      <div id="hero-title"></div>
    </div>
    <div id="widgets">
      <div id="clock"></div>
      <div id="date"></div>
      <div id="weather"></div>
    </div>
  </header>

  <main>
    <div id="dock"></div>
    <div id="hint">OK: open &nbsp;·&nbsp; Hold OK or Down: move / remove</div>
  </main>

  <!-- Hold-OK menu -->
  <div id="menu" class="overlay hidden">
    <div class="panel small">
      <div id="menu-title"></div>
      <div class="menu-item">Move</div>
      <div class="menu-item">Remove from Home</div>
      <div class="menu-item">Cancel</div>
    </div>
  </div>

  <!-- App picker -->
  <div id="picker" class="overlay hidden">
    <div class="panel">
      <h2>Choose apps for Home</h2>
      <div id="picker-list"></div>
      <div class="picker-hint">OK: add / remove &nbsp;·&nbsp; Back: done</div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="overlay hidden">
    <div class="panel">
      <h2>Customize</h2>
      <div id="settings-list"></div>
      <div class="picker-hint">Up / Down: choose &nbsp;·&nbsp; Left / Right: change &nbsp;·&nbsp; Back: done</div>
    </div>
  </div>

  <script src="custom.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
